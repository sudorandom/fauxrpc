# yaml-language-server: $schema=../../stubs.schema.json
---
stubs:
- id: get-pets-by-id-id-1
  target: io.swagger.petstore.v2.PetService/GetPetByID
  active_if: req.pet_id == 1
  priority: 100
  content:
    id: 1
    category:
      id: 1
      name: cat
    name: Whiskers
    photo_urls:
    - https://cataas.com/cat
    tags:
    - id: 1
      name: cute
    - id: 2
      name: kid-friendly
    status: available
- id: get-pets-by-id-default
  target: io.swagger.petstore.v2.PetService/GetPetByID
  cel_content: |
    {
        'id': req.pet_id,
        'category': {'id': gen, 'name': 'gen'},
        'name': gen,
        'photo_urls': gen,
        'tags': [{'id': gen, 'name': gen}],
        'status': gen
    }
- id: get-pets-by-id-dynamic
  target: io.swagger.petstore.v2.PetService/GetPetByID
  cel_content: |
    {
        'id': req.pet_id,
        'name': fake_pet_name(),
        'status': ['available', 'pending', 'sold'][fake_int() % 3],
        'category': {
            'id': fake_int() % 10 + 1,
            'name': ['dog', 'cat', 'bird', 'fish', 'reptile'][fake_int() % 5]
        },
        'photo_urls': [
            'https://picsum.photos/seed/' + string(req.pet_id) + '/200/300'
        ],
        'tags': [
            {
                'id': fake_int() % 100 + 1,
                'name': fake_adjective()
            }
        ]
    }